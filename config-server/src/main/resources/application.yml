server:
  port: 8888

spring:
  application:
    name: config-server
  profiles:
    active: ${CONFIG_SERVER_PROFILE:native}
  cloud:
    config:
      server:
        native:
          search-locations: classpath:/config-repo, file:./config-repo-template, file:../config-repo-template
        git:
          uri: ${CONFIG_REPO_URI:https://github.com/your-org/smart-courier-config.git}
          default-label: ${CONFIG_REPO_DEFAULT_LABEL:main}
          clone-on-start: true
          force-pull: true
          username: ${CONFIG_REPO_USERNAME:}
          password: ${CONFIG_REPO_PASSWORD:}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}

management:
  endpoints:
    web:
      exposure:
        include: health,info,env,refresh
